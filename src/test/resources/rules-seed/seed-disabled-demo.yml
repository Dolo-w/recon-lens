# 单测专用（同 rules-seed/ 目录）：给"下线过的规则不因重启复活"用例用。
code: SEED_DISABLED_DEMO
name: 种子复活用例（文件这一版）
description: 只比对金额

left:
  label: 账单
  table: bill_left
  keyField: order_no
  keyType: STRING
  orderBy: order_no

right:
  label: 结算
  table: bill_right
  keyField: order_no
  keyType: STRING
  orderBy: order_no

shard:
  count: 1
  parallelism: 1

compare:
  - field: amount
    type: DECIMAL
    tolerance: 0.01
    diffType: AMOUNT_MISMATCH
    severity: HIGH

missing:
  leftMissingDiffType: MISSING_LEFT
  rightMissingDiffType: MISSING_RIGHT
  severity: HIGH

duplicate:
  diffType: DUPLICATE_KEY
  severity: MEDIUM

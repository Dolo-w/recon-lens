server:
  port: 8080

spring:
  application:
    name: recon-lens
  datasource:
    url: jdbc:h2:mem:recon;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      # 每个分片同时持有左右两个游标，所以池子至少要有 2 × recon.engine.parallelism（默认 8 → 16），
      # 再留出写差异/写分片状态和 HTTP 请求的余量。实测池 16 在 8 分片时刚好占满：出现
      # "Connection is not available, request timed out after 10004ms" 并触发分片重试，耗时涨 6~11 倍。
      # 详见 docs/benchmark.md「默认连接池 16 会在 8 分片 + 并行度 8 时饿死」。
      maximum-pool-size: 24
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jackson:
    default-property-inclusion: non_null

recon:
  # 规则 DSL 所在位置（classpath: 或 file: 前缀），启动时全部加载
  rules-location: classpath:rules/
  # 是否把上面的 YAML 规则与规则库里的同名规则对齐（库里没有的作 v1；不一致按文件覆盖成新版本；已下线的不复活）
  seed-rules: true
  rules:
    # POST /api/rules 直写并立即生效的旧通路：默认关闭。
    # 它不经过 草稿 → 试算 → 审批（闸门 1/2/3），打开时还必须配 recon.review.api-key，
    # 否则请求一律 403（见 RuleController#requireLegacyDefineAllowed）。
    legacy-define-enabled: false
  engine:
    # 分片并行度，默认取 min(规则内 parallelism, CPU*2)
    parallelism: 8
    # JDBC 游标抓取条数：这是"内存可控"的关键，配合 ORDER BY 做归并式对账
    fetch-size: 2000
    # 单个分片最大重试次数（幂等重跑的基础）
    max-attempts: 2
    # 是否在启动时执行一次演示对账（方便 clone 下来直接看到效果）
    run-demo-on-startup: true
  llm:
    # 归因说明：默认走本地规则模板（离线可用）；打开后走 OpenAI 兼容接口
    enabled: false
    base-url: https://api.openai.com/v1
    # 也可以用环境变量 RECON_LLM_API_KEY 覆盖
    api-key: ""
    model: gpt-4o-mini
    timeout-seconds: 30
    # 单次批量归因最多处理的差异条数
    batch-limit: 50
  # 看表结构（recon_describe_table / GET /api/tables/{table}）的样例值开关。
  # 默认 false = 样例一律打码（手机、证件、邮箱、卡号、姓名、地址）。
  # 打开等于让"看字段"接口把原文吐给任何能调它的人 —— 生产上除非有脱敏视图，否则别开。
  schema:
    sample-raw: false
  # 会话（内建对话）相关。没有 key 也全部可用：模型只做"兜底理解"，词表那一层永远在。
  chat:
    # 摘要压缩的窗口假设（token）：只影响"什么时候开始压"，取小一点只会压得更早，不会丢数据。
    window-tokens: 8000
    summary:
      # 归纳层：有 key 时给摘要补「结论/未决」两段（事实与坐标仍由截断版生成）。
      # 关掉或没有 key 时退回纯截断，行为与 P1 一致。
      llm: true
    llm:
      # 意图理解用的模型。与上面 recon.llm（归因说明）分开配：路由要快、要便宜、要稳定返回 JSON，
      # 归因要写得像人话，两者的模型和温度都不该是同一个。
      # 不填 api-key 就只用词表路由，行为与 P1 完全一致。
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat
      timeout-ms: 8000
      # 把引擎/工具的输出改写成"先一句结论、再明细"的人话。关掉只影响读法，不影响听懂。
      # 没有 api-key 时这一层自动空转，行为与 P1 一致。
      summarize: true
  agent:
    schema:
      # 闸门 1 的表白名单，fail-closed：没列出来的表，起草的规则一律被拒。
      # 这里只放**演示库**里那两张账单表，目的是让「clone 下来 → 起草一条规则 → 试算」
      # 这条链路开箱可用；生产档（application-mysql.yml）故意留空，必须由部署方显式列出。
      # 新增业务表也可以不写在这里，改用 recon_register_table 动态注册（落到 recon_registered_table）。
      tables:
        - bill_left
        - bill_right

logging:
  level:
    io.github.dolow.reconlens: INFO

# 单测专用：只给 RuleCatalogTest 的"种子覆盖同名规则"用例加载（recon.rules-location=classpath:rules-seed/）。
# 故意只比 amount，用例里手动改成比 status 之后，靠"文件覆盖"把它改回来。
code: SEED_OVERWRITE_DEMO
name: 种子覆盖用例（文件这一版）
description: 只比对金额

left:
  label: 账单
  table: bill_left
  keyField: order_no
  keyType: STRING
  orderBy: order_no

right:
  label: 结算
  table: bill_right
  keyField: order_no
  keyType: STRING
  orderBy: order_no

shard:
  count: 1
  parallelism: 1

compare:
  - field: amount
    type: DECIMAL
    tolerance: 0.01
    diffType: AMOUNT_MISMATCH
    severity: HIGH

missing:
  leftMissingDiffType: MISSING_LEFT
  rightMissingDiffType: MISSING_RIGHT
  severity: HIGH

duplicate:
  diffType: DUPLICATE_KEY
  severity: MEDIUM

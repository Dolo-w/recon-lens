name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 跑测试（用仓库自带的 mvnw，保证本地和 CI 同一套 Maven）
        run: ./mvnw -B --no-transfer-progress test

      - name: 打包并跑 MCP 协议冒烟
        run: |
          ./mvnw -B --no-transfer-progress -DskipTests package
          node tools/mcp-smoke.mjs target/recon-lens-0.1.0.jar

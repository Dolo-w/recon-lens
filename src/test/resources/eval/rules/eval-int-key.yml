# 数字业务键：键类型口径与字符串键不同（前导零、类型转换是经典坑）
code: EVAL_INT_KEY
name: eval 数字键金额对账
left:
  label: 账单
  table: eval_left
  keyType: LONG
  dimension: [biz_key]
right:
  label: 结算
  table: eval_right
  keyType: LONG
  dimension: [biz_key]
shard:
  count: 1
  parallelism: 1
compare:
  - field: amount
    type: DECIMAL
    tolerance: 0
    diffType: AMOUNT_MISMATCH
    severity: HIGH
missing:
  leftMissingDiffType: MISSING_LEFT
  rightMissingDiffType: MISSING_RIGHT
  severity: HIGH
duplicate:
  diffType: DUPLICATE_KEY
  severity: MEDIUM
options:
  maxAttempts: 1

code: S7_NARROW
name: S7 窄口径（只取对账需要的 4 列）
description: 引擎端到端基准：两侧各 200 万行，SQL 收窄到 id/order_no/amount/status
left:
  label: 账单
  sql: SELECT id, order_no, amount, status FROM bill_left
  keyField: order_no
  keyType: STRING
  orderBy: order_no
right:
  label: 结算
  sql: SELECT id, order_no, amount, status FROM bill_right
  keyField: order_no
  keyType: STRING
  orderBy: order_no
shard:
  count: 1
compare:
  - field: amount
    type: DECIMAL
    tolerance: 0.01
    diffType: AMOUNT_MISMATCH
    severity: HIGH
  - field: status
    type: STRING
    ignoreCase: true
    diffType: STATUS_MISMATCH
    severity: MEDIUM
missing:
  leftMissingDiffType: MISSING_LEFT
  rightMissingDiffType: MISSING_RIGHT
  severity: HIGH
duplicate:
  diffType: DUPLICATE_KEY
  severity: MEDIUM
options:
  maxAttempts: 2

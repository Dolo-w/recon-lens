# 字段语义字典（K3）：给"这列是什么口径"一个可查、可复算的答案。
#
# 哲学与规则/模式库同款：git 可审、可 diff、改动走 PR。
# 客户可用 recon.explain.semantics.dir 指向外部目录追加/覆盖（同 (table,column) 外部赢）。
# 导入连接器时 importer 登记的是"列存在性"（事实）；语义（理解）由人工补录。
#
# 消费点：
#   1. recon_describe_table 返回列 + 语义 + 枚举含义（模型写规则的上下文质量直接提升）；
#   2. 规则起草闸门：两侧 caliber/unit 冲突 → WARN（落起草轨迹，判定权在审批人）。
#
# ⚠️ 口径冲突的判定只比两侧都登记了的维度（caliber / unit）——
#    只有一边知道口径不构成冲突证据（"不知道"不能当"不一样"用）。

tables:
  bill_left:
    label: 账单（我方）
    columns:
      amount:
        semantic: 我方账单金额
        caliber: 不含税
        unit: 元
      status:
        semantic: 账单状态
        enum:
          SETTLED: 已结算
          PENDING: 未到结算日
          VOIDED: 已作废
  bill_right:
    label: 结算（对方）
    columns:
      amount:
        semantic: 对方结算金额
        caliber: 不含税
        unit: 元
      status:
        semantic: 结算状态
        enum:
          SETTLED: 已结算
          PENDING: 未到结算日
  # 口径冲突的写法示例（外部字典里常见）：
  # lago_invoice_fees:
  #   columns:
  #     amount:
  #       semantic: Lago 发票费用明细（净额）
  #       caliber: 不含税
  #       unit: 分            # ← 如果对 side 登记的是"元"，起草闸门会 WARN
  #     total:
  #       semantic: 发票总额（含税）
  #       caliber: 含税        # ← 与 bill_left.amount 的"不含税"冲突，起草时会被喊出来

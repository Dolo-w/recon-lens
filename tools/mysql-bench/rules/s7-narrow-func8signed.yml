code: S7_NARROW_FUNC8SIGNED
name: S7 窄口径 8 分片（函数谓词，CAST 类型与生成列不一致）
description: 与 S7_NARROW_FUNC8 只差一个 CAST 类型：AS SIGNED 无法替换成生成列 shard_bucket，索引失效、每片扫全索引
left:
  label: 账单
  sql: SELECT id, order_no, amount, status FROM bill_left
  keyField: order_no
  keyType: STRING
  orderBy: order_no
right:
  label: 结算
  sql: SELECT id, order_no, amount, status FROM bill_right
  keyField: order_no
  keyType: STRING
  orderBy: order_no
shard:
  count: 8
  parallelism: 8
  whereLeft: MOD(CAST(SUBSTRING(order_no, 10, 2) AS SIGNED), {shards}) = {index}
  whereRight: MOD(CAST(SUBSTRING(order_no, 10, 2) AS SIGNED), {shards}) = {index}
compare:
  - field: amount
    type: DECIMAL
    tolerance: 0.01
    diffType: AMOUNT_MISMATCH
    severity: HIGH
  - field: status
    type: STRING
    ignoreCase: true
    diffType: STATUS_MISMATCH
    severity: MEDIUM
missing:
  leftMissingDiffType: MISSING_LEFT
  rightMissingDiffType: MISSING_RIGHT
  severity: HIGH
duplicate:
  diffType: DUPLICATE_KEY
  severity: MEDIUM
options:
  maxAttempts: 2

server:
  port: 8080

# 生产级可观测性（清单 P0-1 / 8.4 / 8.6）。
# health 给编排系统探活（liveness/readiness 分开，滚动重启不会误杀还在收尾的实例）；
# metrics/prometheus 给监控抓取；info 用于发布时核对版本。
# show-details 默认 when_authorized：没接认证时等于不吐内部细节，生产安全；排障时临时加
#   --management.endpoint.health.show-details=always 即可。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: recon-lens
  # 显式开启：Boot 的 @ConditionalOnEnabledMetricsExport 会读 management.defaults.metrics.export.enabled，
  # 在某些配置组合下它被判为 false，Prometheus registry 就不会注册（表现为 /actuator/prometheus 404
  # 且 registry 退化成 SimpleMeterRegistry）。写死 true 比依赖默认值稳。
  prometheus:
    metrics:
      export:
        enabled: true
  defaults:
    metrics:
      export:
        enabled: true

spring:
  application:
    name: recon-lens
  datasource:
    url: jdbc:h2:mem:recon;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      # 每个分片同时持有左右两个游标，所以池子至少要有 2 × recon.engine.parallelism（默认 8 → 16），
      # 再留出写差异/写分片状态和 HTTP 请求的余量。实测池 16 在 8 分片时刚好占满：出现
      # "Connection is not available, request timed out after 10004ms" 并触发分片重试，耗时涨 6~11 倍。
      # 详见 docs/benchmark.md「默认连接池 16 会在 8 分片 + 并行度 8 时饿死」。
      maximum-pool-size: 24
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jackson:
    default-property-inclusion: non_null

recon:
  # ---- 告警最小集（清单 P0-6）----
  # 只放三条能直接对应钱和风险的规则：LLM 失败率 / 写接口裸奔 / 单日成本。
  # enabled=false 只是关掉自动检查，POST /api/alerts/check 手动触发仍可用。
  alert:
    enabled: false
    check-interval-ms: 300000
    # 通知地址（企业微信/钉钉/自建 relay），收到 POST JSON；留空则只落库不推送
    webhook-url: ""
    llm-failure-rate-threshold: 0.3
    # 最小样本量：窗口内调用少于这个数就不判失败率（避免 1 次失败 = 100%）
    llm-failure-min-calls: 5
    llm-failure-window-minutes: 30
    # 单日成本阈值（元）；0 = 不检查
    daily-cost-yuan-threshold: 50.0
  # 规则 DSL 所在位置（classpath: 或 file: 前缀），启动时全部加载
  rules-location: classpath:rules/
  # 是否把上面的 YAML 规则与规则库里的同名规则对齐（库里没有的作 v1；不一致按文件覆盖成新版本；已下线的不复活）
  seed-rules: true
  rules:
    # POST /api/rules 直写并立即生效的旧通路：默认关闭。
    # 它不经过 草稿 → 试算 → 审批（闸门 1/2/3），打开时还必须配 recon.review.api-key，
    # 否则请求一律 403（见 RuleController#requireLegacyDefineAllowed）。
    legacy-define-enabled: false
  engine:
    # 分片并行度，默认取 min(规则内 parallelism, CPU*2)
    parallelism: 8
    # 执行模式：默认（不配）是 go-worker（正式对账统一走 Go worker 二进制）。
    # 这里显式 inprocess：本地裸 java -jar 没有 worker 二进制，保住开箱即跑的演示；
    # 生产/MySQL 档（application-mysql.yml，Docker 镜像内必含 worker）显式 go-worker。
    execution: inprocess
    # JDBC 游标抓取条数：这是"内存可控"的关键，配合 ORDER BY 做归并式对账
    fetch-size: 2000
    # 单个分片最大重试次数（幂等重跑的基础）
    max-attempts: 2
    # 是否在启动时执行一次演示对账（方便 clone 下来直接看到效果）
    run-demo-on-startup: true
  # 归因链路（K2 知识层）：知识库(L1) → 模式库(L0) → 大模型(L2) → 内置模板(L3)。
  # L1/L0 全部零模型成本；命中率上升 = LLM 调用下降，这是本系统的核心经济曲线。
  explain:
    knowledge:
      # 关掉就退回"直接调 LLM"，用于验证知识库是否真的在省调用
      enabled: true
      # LLM 自产条目置信度就是 0.5，门槛高于它 = 只信人工修正过的答案
      min-confidence: 0.5
    patterns:
      # 经验模式库（K2 / L0）：机械特征联想，内容在 classpath:patterns/diff-patterns.yml，
      # 客户可加 recon.explain.patterns.dir 指向外部目录（同 id 外部覆盖，mtime 热加载）
      enabled: true
      dir: ""
      # 单条差异最多联想几个候选模式（防 prompt 膨胀）
      max-candidates: 3
  llm:
    # 归因说明：默认走本地规则模板（离线可用）；打开后走 OpenAI 兼容接口
    enabled: false
    base-url: https://api.openai.com/v1
    # 也可以用环境变量 RECON_LLM_API_KEY 覆盖
    api-key: ""
    model: gpt-4o-mini
    timeout-seconds: 30
    # 单次批量归因最多处理的差异条数
    batch-limit: 50
    # ---- 容错（清单 P0-4）：一次 API 抖动不该毁掉整条采集链 ----
    # 只对可重试错误生效（网络/超时/429/5xx）；401/400 这类配置错会直接换 provider，不做无用重试。
    max-attempts: 3
    # 指数退避基数（毫秒），带 ±25% 抖动防多实例同步重试
    retry-base-delay-millis: 400
    # ---- 成本归因（清单 P0-2）：单位「元 / 百万 token」，默认取 DeepSeek 公开价 ----
    # 这是落库时的快照，改价只影响之后的记录，不会篡改历史账。换模型务必改这两行。
    price-input-per-mtok: 2.0
    price-output-per-mtok: 8.0
    # 备用 provider：主 provider 整体不可用时接管。base-url 留空 = 不启用（行为与旧版一致）。
    fallback:
      base-url: ""
      api-key: ""      # 留空则沿用主 provider 的 key
      model: ""        # 留空则沿用主 provider 的 model
      # price-input-per-mtok / price-output-per-mtok 不填则沿用主 provider 的价
  # 看表结构（recon_describe_table / GET /api/tables/{table}）的样例值开关。
  # 默认 false = 样例一律打码（手机、证件、邮箱、卡号、姓名、地址）。
  # 打开等于让"看字段"接口把原文吐给任何能调它的人 —— 生产上除非有脱敏视图，否则别开。
  schema:
    sample-raw: false
  # 会话（内建对话）相关。没有 key 也全部可用：模型只做"兜底理解"，词表那一层永远在。
  chat:
    # 摘要压缩的窗口假设（token）：只影响"什么时候开始压"，取小一点只会压得更早，不会丢数据。
    window-tokens: 8000
    summary:
      # 归纳层：有 key 时给摘要补「结论/未决」两段（事实与坐标仍由截断版生成）。
      # 关掉或没有 key 时退回纯截断，行为与 P1 一致。
      llm: true
    llm:
      # 意图理解用的模型。与上面 recon.llm（归因说明）分开配：路由要快、要便宜、要稳定返回 JSON，
      # 归因要写得像人话，两者的模型和温度都不该是同一个。
      # 不填 api-key 就只用词表路由，行为与 P1 完全一致。
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat
      timeout-ms: 8000
      # 会话路径默认不重试：用户在看屏幕，重试一次就是再等一个 timeout，
      # 而且会把上行熔断器看到的"失败一次"变成"底层请求两次"，把阈值算歪。
      # 模型挂掉的正解是立刻退回词表（已实现），不是原地重试。想在部署档开就改这里。
      max-attempts: 1
      # 把引擎/工具的输出改写成"先一句结论、再明细"的人话。关掉只影响读法，不影响听懂。
      # 没有 api-key 时这一层自动空转，行为与 P1 一致。
      summarize: true
  agent:
    # 演示档默认开启：首页控制台（static/index.html）的会话接口全挂在 agent 装配下，
    # 关掉时页面还在、后端退场，一打开就是一排 404 —— "clone 下来 30 秒跑起来"
    # 应该看到全功能。生产档（application-mysql.yml）显式关闭，按需打开。
    enabled: true
    schema:
      # 闸门 1 的表白名单，fail-closed：没列出来的表，起草的规则一律被拒。
      # 这里只放**演示库**里那两张账单表，目的是让「clone 下来 → 起草一条规则 → 试算」
      # 这条链路开箱可用；生产档（application-mysql.yml）故意留空，必须由部署方显式列出。
      # 新增业务表也可以不写在这里，改用 recon_register_table 动态注册（落到 recon_registered_table）。
      tables:
        - bill_left
        - bill_right

logging:
  level:
    io.github.dolow.reconlens: INFO

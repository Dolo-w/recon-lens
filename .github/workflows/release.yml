name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 测试并打包
        run: ./mvnw -B --no-transfer-progress package

      - name: 协议级冒烟（打包产物，不装客户端也能验）
        run: node tools/mcp-smoke.mjs target/recon-lens-0.1.0.jar

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go-worker/go.mod

      - name: 构建三平台 worker 二进制（CGO_ENABLED=0 静态链接，扔进去就跑）
        working-directory: go-worker
        run: |
          GOOS=linux   GOARCH=amd64 go build -o ../dist/recon-worker-linux-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -o ../dist/recon-worker-darwin-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -o ../dist/recon-worker-darwin-amd64 .
          GOOS=windows GOARCH=amd64 go build -o ../dist/recon-worker-windows-amd64.exe .

      - name: 发布 Release 并附上可执行 jar 与 worker 二进制
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/recon-lens-*.jar
            dist/recon-worker-*
          generate_release_notes: true
          body: |
            完整变更见 [CHANGELOG.md](https://github.com/Dolo-w/recon-lens/blob/main/CHANGELOG.md)。

            下载 `recon-lens-0.1.0.jar` 后：

            ```bash
            java -jar recon-lens-0.1.0.jar                        # 起服务，启动日志里有一份演示对账报告
            java -jar recon-lens-0.1.0.jar --spring.profiles.active=mcp   # 作为 MCP server（stdio）
            ```

            大批量比对可另下对应平台的 `recon-worker-*` 单二进制（用法见 [go-worker/README.md](https://github.com/Dolo-w/recon-lens/blob/main/go-worker/README.md)）。
